# Builds the OSRM graph and both images, pushes them to Artifact Registry, and deploys Cloud Run.
#   gcloud builds submit services/routing --config services/routing/cloudbuild.yaml \
#     --substitutions=_REGION=me-west1,_REPO=fleetforce
# Pre-processing happens here, never at request time.
substitutions:
  _REGION: me-west1
  _REPO: fleetforce
  _SERVICE: fleetforce-routing
  _GEOFABRIK_PATH: asia/israel-and-palestine
  _OSRM_IMAGE: ghcr.io/project-osrm/osrm-backend:v5.27.1
  _DEPLOY: "true"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: download-extract
    name: gcr.io/cloud-builders/curl
    entrypoint: bash
    args:
      - -c
      - mkdir -p osrm/data && curl -fL --retry 3 -o osrm/data/map.osm.pbf "https://download.geofabrik.de/${_GEOFABRIK_PATH}-latest.osm.pbf"

  - id: osrm-extract
    name: ${_OSRM_IMAGE}
    args: [osrm-extract, -p, /opt/car.lua, osrm/data/map.osm.pbf]

  - id: osrm-partition
    name: ${_OSRM_IMAGE}
    args: [osrm-partition, osrm/data/map.osrm]

  - id: osrm-customize
    name: ${_OSRM_IMAGE}
    args: [osrm-customize, osrm/data/map.osrm]

  - id: test-api
    name: python:3.12-slim
    entrypoint: bash
    args: [-c, pip install -q -r requirements-dev.txt && python -m pytest -q]
    waitFor: ["-"]

  - id: build-osrm
    name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -t,
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/osrm-israel:$BUILD_ID",
        osrm
      ]
    waitFor: [osrm-customize]

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -t,
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/routing-api:$BUILD_ID",
        .
      ]
    waitFor: [test-api]

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/osrm-israel:$BUILD_ID &&
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/routing-api:$BUILD_ID
    waitFor: [build-osrm, build-api]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [ "${_DEPLOY}" = "true" ] || { echo "Skipping deploy"; exit 0; }
        sed -e "s|PROJECT_ID|$PROJECT_ID|" \
            -e "s|API_IMAGE|${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/routing-api:$BUILD_ID|" \
            -e "s|OSRM_IMAGE|${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/osrm-israel:$BUILD_ID|" \
            -e "s|SERVICE_NAME|${_SERVICE}|" service.yaml > /workspace/service.rendered.yaml
        gcloud run services replace /workspace/service.rendered.yaml --region ${_REGION}

timeout: 3600s
