# Local stack: OSRM sidecar + API, same shape as the Cloud Run service.
# First run ./osrm/prepare.sh once to build osrm/data/map.osrm*.
services:
  osrm:
    build: ./osrm
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs 'http://localhost:5000/nearest/v1/driving/34.7913,31.2518' || exit 1"
        ]
      interval: 10s
      retries: 6

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      OSRM_URL: http://osrm:5000
      MATRIX_SOURCE: osrm
      FLEETFORCE_AUTH_DISABLED: "1"
    depends_on:
      - osrm
