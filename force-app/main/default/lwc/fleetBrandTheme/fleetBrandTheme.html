<template>
  <lightning-card
    title="Brand & Theme"
    icon-name="standard:custom_notification"
  >
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text="Loading brand settings"
          size="medium"
        ></lightning-spinner>
      </template>

      <template lwc:if={error}>
        <div
          class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium"
          role="alert"
        >
          <h2>{error}</h2>
        </div>
      </template>

      <p class="slds-text-color_weak slds-m-bottom_medium">
        Customize vehicle visual rendering styles and company branding across
        the FleetForce platform.
      </p>

      <!-- ================= CARD 1: VEHICLE ICON STYLE ================= -->
      <div class="brand-card slds-box slds-m-bottom_medium">
        <!-- Overview Mode -->
        <template lwc:if={isStyleOverview}>
          <div
            class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small"
          >
            <div class="slds-grid slds-grid_vertical-align-center">
              <lightning-icon
                icon-name="standard:asset_relationship"
                size="small"
                class="slds-m-right_small"
              ></lightning-icon>
              <div>
                <h3 class="slds-text-heading_small slds-text-title_bold">
                  Vehicle Icon Style
                </h3>
                <p class="slds-text-color_weak slds-text-body_small">
                  Visual rendering style applied to vehicles across fleet lists,
                  map overlays, operational cards, and mobile views.
                </p>
              </div>
            </div>
            <div class="slds-grid slds-grid_vertical-align-center">
              <span class="slds-badge slds-theme_info slds-m-right_small"
                >{activeStyleLabel}</span
              >
              <template lwc:if={canEdit}>
                <lightning-button
                  label="Modify Icon Style"
                  icon-name="utility:edit"
                  onclick={handleEditStyle}
                ></lightning-button>
              </template>
            </div>
          </div>

          <!-- Active Style Preview -->
          <div
            class="slds-p-around_small slds-theme_shade slds-border_rounded slds-m-top_small"
          >
            <span
              class="slds-text-title_caps slds-text-color_weak slds-show slds-m-bottom_x-small"
              >Current Active Style: {activeStyleLabel}</span
            >
            <div class="tile__samples">
              <template for:each={activeStyleSamples} for:item="s">
                <c-fleet-vehicle-image
                  key={s.key}
                  variant="icon"
                  size="96"
                  icon-style={serverSettings.iconStyle}
                  body-type={s.bodyType}
                  color={s.color}
                  fuel-type={s.fuelType}
                ></c-fleet-vehicle-image>
              </template>
            </div>
          </div>
        </template>

        <!-- Edit Mode -->
        <template lwc:if={isStyleEditing}>
          <div
            class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small slds-border_bottom slds-p-bottom_small"
          >
            <div>
              <h4 class="slds-text-title_bold">Select Vehicle Icon Style</h4>
              <p class="slds-text-color_weak slds-text-body_small">
                Choose a visual rendering style. Changes apply to all users
                across the organization.
              </p>
            </div>
            <span class="slds-badge slds-theme_warning">Editing Style</span>
          </div>

          <div
            class="tiles slds-m-bottom_small"
            role="radiogroup"
            aria-label="Vehicle icon style"
          >
            <template for:each={options} for:item="o">
              <div
                key={o.value}
                class={o.tileClass}
                role="radio"
                tabindex="0"
                aria-checked={o.ariaChecked}
                data-value={o.value}
                onclick={handleSelectStyle}
                onkeydown={handleKeyStyle}
              >
                <div class="tile__head">
                  <span class="tile__name">{o.label}</span>
                  <template lwc:if={o.isSelected}>
                    <lightning-icon
                      icon-name="utility:check"
                      size="x-small"
                      variant="success"
                    ></lightning-icon>
                  </template>
                </div>
                <p class="tile__blurb">{o.blurb}</p>
                <div class="tile__samples">
                  <template for:each={o.samples} for:item="s">
                    <c-fleet-vehicle-image
                      key={s.key}
                      variant="icon"
                      size="96"
                      icon-style={o.value}
                      body-type={s.bodyType}
                      color={s.color}
                      fuel-type={s.fuelType}
                    ></c-fleet-vehicle-image>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <div class="slds-grid slds-grid_align-end slds-m-top_small">
            <lightning-button
              label="Cancel"
              class="slds-m-right_x-small"
              onclick={handleCancelStyle}
              disabled={saving}
            ></lightning-button>
            <lightning-button
              variant="brand"
              label="Save Icon Style"
              onclick={handleSaveStyle}
              disabled={saving}
            ></lightning-button>
          </div>
        </template>
      </div>

      <!-- ================= CARD 2: SALESFORCE THEMES & BRANDING ================= -->
      <div class="brand-card slds-box">
        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small"
        >
          <div class="slds-grid slds-grid_vertical-align-center">
            <lightning-icon
              icon-name="standard:theme"
              size="small"
              class="slds-m-right_small"
            ></lightning-icon>
            <div>
              <h3 class="slds-text-heading_small slds-text-title_bold">
                Salesforce Themes &amp; Branding
              </h3>
              <p class="slds-text-color_weak slds-text-body_small">
                Enterprise company logo, primary colors, navigation headers, and
                loading animation override.
              </p>
            </div>
          </div>
          <div class="slds-grid slds-grid_vertical-align-center">
            <template lwc:if={serverSettings.hasCustomTheme}>
              <span class="slds-badge slds-theme_success slds-m-right_small">
                Custom Theme Active
              </span>
            </template>
            <template lwc:else>
              <span class="slds-badge slds-badge_lightest slds-m-right_small">
                Standard Salesforce Theme
              </span>
            </template>

            <template lwc:if={serverSettings.hasCustomTheme}>
              <lightning-button
                variant="brand"
                label="Edit Active Theme"
                icon-name="utility:edit"
                onclick={handleOpenActiveTheme}
                class="slds-m-right_x-small"
              ></lightning-button>
            </template>

            <lightning-button
              variant="neutral"
              label="Open Themes &amp; Branding in Setup"
              icon-name="utility:new_window"
              onclick={handleOpenThemesSetup}
            ></lightning-button>
          </div>
        </div>

        <!-- Active Theme Information Box -->
        <div
          class="slds-p-around_small slds-theme_shade slds-border_rounded slds-m-top_small"
        >
          <div
            class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
          >
            <div>
              <span
                class="slds-text-title_caps slds-text-color_weak slds-show slds-m-bottom_xx-small"
              >
                Active Organization Theme
              </span>
              <div class="slds-grid slds-grid_vertical-align-center">
                <template lwc:if={serverSettings.hasCustomTheme}>
                  <a
                    href={serverSettings.activeThemeEditUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    class="slds-text-heading_small slds-text-title_bold slds-m-right_x-small"
                  >
                    {serverSettings.activeThemeName}
                  </a>
                  <lightning-icon
                    icon-name="utility:new_window"
                    size="xx-small"
                    class="slds-m-right_small"
                  ></lightning-icon>
                </template>
                <template lwc:else>
                  <span
                    class="slds-text-heading_small slds-text-title_bold slds-m-right_small"
                  >
                    {serverSettings.activeThemeName}
                  </span>
                </template>

                <template lwc:if={serverSettings.overrideLoadingImage}>
                  <span class="slds-badge slds-theme_info slds-m-right_x-small">
                    Astro Spinner Replaced
                  </span>
                </template>
              </div>
            </div>

            <!-- Brand Color swatch if available -->
            <template lwc:if={serverSettings.activeBrandColor}>
              <div class="slds-grid slds-grid_vertical-align-center">
                <span
                  class="slds-text-body_small slds-text-color_weak slds-m-right_x-small"
                >
                  Brand Color:
                </span>
                <span class="color-pill slds-badge" style={brandColorStyle}>
                  {serverSettings.activeBrandColor}
                </span>
              </div>
            </template>
          </div>

          <!-- Brand Logo Preview from Theme if configured -->
          <template lwc:if={serverSettings.activeBrandImageUrl}>
            <div
              class="slds-m-top_small slds-p-around_small slds-box slds-box_x-small logo-theme-box"
            >
              <span
                class="slds-text-title_caps slds-text-color_weak slds-show slds-m-bottom_xx-small"
              >
                Theme Brand Logo
              </span>
              <img
                src={serverSettings.activeBrandImageUrl}
                alt={serverSettings.activeThemeName}
                class="theme-logo-preview"
              />
            </div>
          </template>

          <p
            class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
          >
            Salesforce Lightning controls the global top navigation bar, company
            logo, and loading animations through native Themes &amp; Branding.
            Clicking <strong>Edit Active Theme</strong> opens this theme
            directly in Setup, or click
            <strong>Open Themes &amp; Branding in Setup</strong> to browse and
            activate all available themes.
          </p>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
