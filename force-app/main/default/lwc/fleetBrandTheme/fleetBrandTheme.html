<template>
  <lightning-card
    title="Brand & Theme"
    icon-name="standard:custom_notification"
  >
    <div slot="actions">
      <lightning-button
        label="Reset to Saved"
        onclick={handleCancel}
        disabled={saveDisabled}
        class="slds-m-right_x-small"
      ></lightning-button>
      <lightning-button
        variant="brand"
        label="Save Brand & Theme"
        onclick={handleSave}
        disabled={saveDisabled}
      ></lightning-button>
    </div>

    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text="Loading brand settings"
          size="medium"
        ></lightning-spinner>
      </template>

      <template lwc:if={error}>
        <div
          class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium"
          role="alert"
        >
          <h2>{error}</h2>
        </div>
      </template>

      <!-- Section 1: Vehicle Icon Style -->
      <div class="slds-m-bottom_large">
        <h2 class="slds-text-heading_small slds-text-title_bold">
          Vehicle Icon Style
        </h2>
        <p class="slds-text-color_weak slds-m-bottom_small">
          Choose how vehicles are visually rendered across fleet lists, map
          overlays, operational cards, and mobile views. This setting applies to
          all users in the organization.
        </p>

        <div class="tiles" role="radiogroup" aria-label="Vehicle icon style">
          <template for:each={options} for:item="o">
            <div
              key={o.value}
              class={o.tileClass}
              role="radio"
              tabindex="0"
              aria-checked={o.ariaChecked}
              data-value={o.value}
              onclick={handleSelectStyle}
              onkeydown={handleKeyStyle}
            >
              <div class="tile__head">
                <span class="tile__name">{o.label}</span>
                <template lwc:if={o.isSelected}>
                  <lightning-icon
                    icon-name="utility:check"
                    size="x-small"
                    variant="success"
                    alternative-text="Selected"
                  ></lightning-icon>
                </template>
              </div>
              <p class="tile__blurb">{o.blurb}</p>
              <div class="tile__samples">
                <template for:each={o.samples} for:item="s">
                  <c-fleet-vehicle-image
                    key={s.key}
                    variant="icon"
                    size="96"
                    icon-style={o.value}
                    body-type={s.bodyType}
                    color={s.color}
                    fuel-type={s.fuelType}
                  ></c-fleet-vehicle-image>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Section 2: Application Theme & Brand Customization -->
      <div class="theme-box slds-box">
        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small"
        >
          <div class="slds-grid slds-grid_vertical-align-center">
            <lightning-icon
              icon-name="standard:portal"
              size="small"
              class="slds-m-right_small"
            ></lightning-icon>
            <div>
              <h3 class="slds-text-heading_small slds-text-title_bold">
                Brand Identity & Theme
              </h3>
              <p class="slds-text-color_weak slds-text-body_small">
                Control the branding displayed across FleetForce headers,
                navigation bars, and loading states.
              </p>
            </div>
          </div>
          <div class="slds-grid slds-grid_vertical-align-center">
            <span class="slds-text-body_small slds-m-right_x-small"
              >Custom Organization Theme:</span
            >
            <lightning-input
              type="toggle"
              name="useCustomTheme"
              label="Custom Theme Toggle"
              variant="label-hidden"
              checked={draft.useCustomTheme}
              onchange={handleThemeToggle}
            ></lightning-input>
          </div>
        </div>

        <!-- Default: FleetForce Packaged Brand -->
        <template lwc:if={isPackagedTheme}>
          <div
            class="slds-p-around_medium slds-theme_shade slds-border_rounded"
          >
            <div
              class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center"
            >
              <div>
                <div
                  class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small"
                >
                  <strong class="slds-text-body_regular"
                    >FleetForce Packaged Theme</strong
                  >
                  <span class="slds-badge slds-theme_success slds-m-left_small"
                    >Default Active</span
                  >
                </div>
                <p class="slds-text-color_weak slds-text-body_small">
                  Uses the signature FleetForce dark navy header (#0F1E33) and
                  the official Waypoint logo. To customize your company's logo,
                  colors, and loading animation, switch to "Custom Organization
                  Theme" above.
                </p>
              </div>
              <div
                class="palette-swatch slds-m-top_small slds-m-medium-top_none"
              >
                <div
                  class="swatch-color"
                  style="background-color: #0f1e33"
                ></div>
                <span class="swatch-label">#0F1E33<br />Navy</span>
              </div>
            </div>
          </div>
        </template>

        <!-- Custom Theme Configuration Form -->
        <template lwc:if={draft.useCustomTheme}>
          <div
            class="slds-p-around_medium slds-box slds-theme_default slds-m-top_small"
          >
            <div class="slds-grid slds-wrap slds-gutters_small">
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small"
              >
                <lightning-input
                  label="Custom Theme Name"
                  name="customThemeName"
                  value={draft.customThemeName}
                  placeholder="e.g. Acme Fleet Operations"
                  onchange={handleFieldChange}
                ></lightning-input>
              </div>

              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small"
              >
                <lightning-input
                  type="color"
                  label="Primary Header Color"
                  name="customBrandColor"
                  value={draft.customBrandColor}
                  onchange={handleFieldChange}
                ></lightning-input>
              </div>

              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small"
              >
                <lightning-input
                  label="Company Logo Asset Name or URL"
                  name="customLogoUrl"
                  value={draft.customLogoUrl}
                  placeholder="e.g. Acme_Logo or https://..."
                  field-level-help="When set, FleetForce automatically applies your company logo to headers and loading spinners."
                  onchange={handleFieldChange}
                ></lightning-input>
              </div>
            </div>

            <!-- Clean Company Brand Guidance Note -->
            <div
              class="slds-p-around_small slds-theme_shade slds-border_rounded slds-m-top_small"
            >
              <div
                class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small"
              >
                <lightning-icon
                  icon-name="utility:image"
                  size="x-small"
                  class="slds-m-right_xx-small"
                ></lightning-icon>
                <strong class="slds-text-body_small"
                  >Company Brand &amp; Logo</strong
                >
              </div>
              <p class="slds-text-body_small slds-text-color_weak">
                Configuring a company logo applies your enterprise branding
                across all FleetForce navigation headers, operational screens,
                and loading states automatically.
              </p>
            </div>
          </div>
        </template>
      </div>
    </div>
  </lightning-card>
</template>
