<template>
    <lightning-card title="Critical Maintenance Alerts" icon-name="standard:maintenance_plan">
        <div class="slds-m-around_medium">
            <template if:true={hasAlerts}>
                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={alerts} for:item="alert">
                        <li class="slds-item slds-p-vertical_small" key={alert.Id} data-id={alert.Id} onclick={handleAlertClick} style="cursor: pointer;">
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                <c-fleet-vehicle-image variant="icon" size="44" class="slds-m-right_small"
                                    body-type={alert.fleetforce__Fleet_Asset__r.fleetforce__Body_Type__c}
                                    color={alert.fleetforce__Fleet_Asset__r.fleetforce__Color__c}
                                    fuel-type={alert.fleetforce__Fleet_Asset__r.fleetforce__Fuel_Type__c}>
                                </c-fleet-vehicle-image>
                                <a class="slds-text-heading_small slds-truncate" title={alert.fleetforce__Fleet_Asset__r.Name}>{alert.fleetforce__Fleet_Asset__r.Name}</a>
                                <span class={alert.badgeClass}>{alert.fleetforce__Priority__c}</span>
                            </div>
                            <p class="slds-text-title slds-m-bottom_xx-small">{alert.fleetforce__Summary__c}</p>
                            <p class="slds-text-body_regular slds-text-color_weak description">{alert.fleetforce__Description__c}</p>
                        </li>
                    </template>
                </ul>
            </template>
            <template if:false={hasAlerts}>
                <div class="slds-text-align_center slds-p-around_medium slds-text-color_success">
                    <lightning-icon icon-name="utility:success" size="medium" variant="success" alternative-text="All clear" class="slds-m-bottom_small"></lightning-icon>
                    <p>No critical maintenance alerts at this time.</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
