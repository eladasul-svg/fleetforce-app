<template>
    <div class="slds-card" dir="rtl">
        <div class="slds-card__header slds-grid slds-grid_align-spread">
            <div class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:task" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title slds-text-heading_small">
                        סטטוס משימות בפנייה
                    </h2>
                </div>
            </div>
            <div class="slds-text-body_small slds-text-color_weak">
                {totalTasksLabel}
            </div>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-grid slds-grid_vertical-align-center slds-wrap status-panel-top">
                <div class="slds-col slds-size_1-of-3 donut-wrapper">
                    <svg viewBox="0 0 36 36" class="donut-chart">
                        <template for:each={donutSegments} for:item="segment">
                            <circle
                                key={segment.key}
                                cx="18"
                                cy="18"
                                r="15.9155"
                                fill="transparent"
                                stroke={segment.color}
                                stroke-width="4"
                                stroke-dasharray={segment.dasharray}
                                stroke-dashoffset={segment.dashoffset}
                            ></circle>
                        </template>
                    </svg>
                </div>
                <div class="slds-col slds-size_2-of-3">
                    <div class="slds-grid slds-grid_vertical-align-center traffic-light">
                        <span class="traffic-dot traffic-dot_green"></span>
                        <span class="traffic-dot traffic-dot_amber"></span>
                        <span class="traffic-dot traffic-dot_red"></span>
                        <span class="slds-text-body_regular slds-m-right_small">
                            {trafficLightSummary}
                        </span>
                    </div>
                </div>
            </div>

            <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
                <template for:each={tiles} for:item="tile">
                    <div key={tile.key} class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                        <div class="slds-box slds-box_x-small slds-text-align_center count-tile" style={tile.style}>
                            <div class="slds-text-heading_medium">{tile.count}</div>
                            <div class="slds-text-body_small slds-text-color_weak">{tile.label}</div>
                        </div>
                    </div>
                </template>
            </div>

            <div class="slds-m-top_medium">
                <template for:each={tasks} for:item="task">
                    <div key={task.id} class="slds-box slds-box_x-small slds-m-bottom_x-small task-row" style={task.rowStyle}>
                        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                            <div class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__figure" style={task.iconStyle}>
                                    <lightning-icon icon-name={task.icon} size="x-small"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <span class="slds-text-body_regular">{task.name}</span>
                                </div>
                            </div>
                            <span class="slds-badge" style={task.badgeStyle}>{task.statusLabel}</span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
