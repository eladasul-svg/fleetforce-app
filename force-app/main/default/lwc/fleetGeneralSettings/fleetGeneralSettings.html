<template>
  <lightning-card
    title="General Settings"
    icon-name="standard:custom_notification"
  >
    <div slot="actions">
      <lightning-button
        label="Reset to Saved"
        onclick={handleCancel}
        disabled={saveDisabled}
        class="slds-m-right_x-small"
      ></lightning-button>
      <lightning-button
        variant="brand"
        label="Save General Settings"
        onclick={handleSave}
        disabled={saveDisabled}
      ></lightning-button>
    </div>

    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <p class="slds-text-color_weak slds-m-bottom_medium">
        Configure global system capabilities, AI analytical engines, and
        compliance protocols across your FleetForce org.
      </p>

      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text="Loading general settings"
          size="medium"
        ></lightning-spinner>
      </template>

      <template lwc:if={error}>
        <div
          class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium"
          role="alert"
        >
          <h2>{error}</h2>
        </div>
      </template>

      <!-- Section 1: AI Strategic Insights -->
      <div class="setting-card slds-box slds-m-bottom_medium">
        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
        >
          <div class="slds-grid slds-grid_vertical-align-center">
            <lightning-icon
              icon-name="standard:service_crew"
              size="small"
              class="slds-m-right_small"
            ></lightning-icon>
            <div>
              <h3 class="slds-text-heading_small slds-text-title_bold">
                AI Strategic Insights Engine
              </h3>
              <p class="slds-text-color_weak slds-text-body_small">
                Empower global fleet managers with predictive risk scoring,
                warranty lapse prevention, and routing anomaly detection.
              </p>
            </div>
          </div>
          <div class="slds-grid slds-grid_vertical-align-center">
            <template lwc:if={draft.enableAiInsights}>
              <span class="slds-badge slds-theme_success slds-m-right_small"
                >Enabled</span
              >
            </template>
            <template lwc:else>
              <span class="slds-badge slds-m-right_small">Disabled</span>
            </template>
            <lightning-input
              type="toggle"
              name="enableAiInsights"
              label="Enable AI Insights"
              variant="label-hidden"
              checked={draft.enableAiInsights}
              onchange={handleToggle}
              disabled={isReadOnly}
            ></lightning-input>
          </div>
        </div>

        <template lwc:if={draft.enableAiInsights}>
          <div
            class="slds-m-top_medium slds-p-top_medium slds-border_top slds-grid slds-wrap slds-gutters"
          >
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <lightning-combobox
                label="Foundational AI Provider"
                name="aiProvider"
                value={draft.aiProvider}
                options={aiProviders}
                onchange={handleFieldChange}
                disabled={isReadOnly}
              ></lightning-combobox>
              <p
                class="slds-text-color_weak slds-m-top_xx-small slds-text-body_small"
              >
                Selects the AI model used for cross-branch telemetry synthesis
                and strategic fleet alerts.
              </p>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <div
                class="token-info-box slds-p-around_small slds-theme_shade slds-border_rounded"
              >
                <div
                  class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small"
                >
                  <lightning-icon
                    icon-name="utility:lock"
                    size="x-small"
                    class="slds-m-right_xx-small"
                  ></lightning-icon>
                  <strong class="slds-text-body_small"
                    >API Key & Gateway Token Policy</strong
                  >
                </div>
                <p class="slds-text-body_small slds-text-color_weak">
                  Enterprise credentials (Named Credentials / External
                  Credentials) manage secure token routing. Multi-cloud token
                  governance (Copilot, OpenAI, Vertex AI) is verified.
                </p>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Section 2: Extended Vehicle Privacy Protocol (Privacy4Cars) -->
      <div class="setting-card slds-box slds-m-bottom_medium">
        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
        >
          <div class="slds-grid slds-grid_vertical-align-center">
            <lightning-icon
              icon-name="standard:privacy_policy"
              size="small"
              class="slds-m-right_small"
            ></lightning-icon>
            <div>
              <div class="slds-grid slds-grid_vertical-align-center">
                <h3
                  class="slds-text-heading_small slds-text-title_bold slds-m-right_small"
                >
                  Extended Vehicle Privacy Protocol
                </h3>
                <span class="slds-badge slds-theme_alt-inverse"
                  >Privacy4Cars Standard</span
                >
              </div>
              <p class="slds-text-color_weak slds-text-body_small">
                Automate digital data sanitization tasks (clearing navigation
                history, paired phone books, garage openers, and personal
                addresses) whenever a vehicle transfers drivers or returns from
                service.
              </p>
            </div>
          </div>
          <div class="slds-grid slds-grid_vertical-align-center">
            <template lwc:if={draft.enableExtendedPrivacy}>
              <span class="slds-badge slds-theme_success slds-m-right_small"
                >Active Enforcement</span
              >
            </template>
            <template lwc:else>
              <span class="slds-badge slds-m-right_small">Inactive</span>
            </template>
            <lightning-input
              type="toggle"
              name="enableExtendedPrivacy"
              label="Enable Extended Privacy"
              variant="label-hidden"
              checked={draft.enableExtendedPrivacy}
              onchange={handleToggle}
              disabled={isReadOnly}
            ></lightning-input>
          </div>
        </div>

        <div class="slds-m-top_small slds-text-body_small slds-text-color_weak">
          <p>
            Vehicles connect to driver phones and store sensitive PII in
            infotainment memory. Activating this policy triggers automated
            driver check-out workflows and attaches manufacturer-specific
            digital wipe guides from the Vehicle Catalogue.
          </p>
        </div>
      </div>

      <!-- Section 3: Record Auto-Naming Engine -->
      <div class="setting-card slds-box">
        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
        >
          <div class="slds-grid slds-grid_vertical-align-center">
            <lightning-icon
              icon-name="standard:process"
              size="small"
              class="slds-m-right_small"
            ></lightning-icon>
            <div>
              <h3 class="slds-text-heading_small slds-text-title_bold">
                Record Auto-Naming Engine
              </h3>
              <p class="slds-text-color_weak slds-text-body_small">
                Centralized formula tokens and standardization rules governing
                Fleet Assets, Reservations, Citations, and Driver
                Qualifications.
              </p>
            </div>
          </div>
          <div class="slds-grid slds-grid_vertical-align-center">
            <span class="slds-badge slds-theme_success slds-m-right_small"
              >4 Objects Configured</span
            >
            <lightning-button
              label="Manage Rules"
              icon-name="utility:forward"
              icon-position="right"
              onclick={navigateToAutoNaming}
            ></lightning-button>
          </div>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
