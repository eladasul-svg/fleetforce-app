<template>
    <lightning-card title="Fleet Map Explorer" icon-name="standard:location">

        <div slot="actions" class="slds-p-right_small slds-grid slds-grid_vertical-align-center">
            <template lwc:if={showOpenLarge}>
                <lightning-button-icon icon-name="utility:new_window" variant="border-filled"
                    alternative-text="Open large map" title="Open large map" class="slds-m-right_x-small"
                    onclick={handleOpenLarge}></lightning-button-icon>
            </template>
            <lightning-button-group>
                <template for:each={filters} for:item="f">
                    <lightning-button
                        key={f.value}
                        label={f.label}
                        variant={f.variant}
                        data-filter={f.value}
                        onclick={handleFilterChange}>
                    </lightning-button>
                </template>
            </lightning-button-group>
        </div>

        <div class="slds-grid slds-wrap map-container slds-border_top">

            <!-- SIDEBAR -->
            <div class="sidebar slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-grow-none slds-border_right slds-theme_shade">

                <div class="sidebar__header slds-p-around_small slds-border_bottom slds-theme_default">
                    <h2 class="slds-text-heading_small">Vehicles ({vehicleCount})</h2>
                </div>

                <div class="scroll-container">
                    <template for:each={rows} for:item="rec">
                        <div key={rec.Id}
                             data-id={rec.Id}
                             onclick={handleVehicleClick}
                             class={rec.rowClass}>
                            <c-fleet-vehicle-summary rec={rec}></c-fleet-vehicle-summary>
                        </div>
                    </template>
                </div>
            </div>

            <!-- MAP -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                <div class="map-wrap">
                    <lightning-map
                        map-markers={mapMarkers}
                        center={mapCenter}
                        zoom-level={zoomLevel}
                        list-view="hidden"
                        onmarkerselect={handleMarkerSelect}>
                    </lightning-map>
                    <template lwc:if={selectedRec}>
                        <div class="map-card">
                            <c-fleet-vehicle-summary rec={selectedRec} show-open show-close
                                onopen={handleOpenRecord} onclose={handleCloseCard}>
                            </c-fleet-vehicle-summary>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <template lwc:if={error}>
            <div class="slds-p-around_medium slds-text-color_error">{error}</div>
        </template>
    </lightning-card>
</template>
