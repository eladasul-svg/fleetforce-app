# FleetForce Phase 1 Seed Recipe — 9-object motorpool spine
#
# Load order:
#   Account → Fleet_Schedule__c → Contact[managers, no branch] →
#   Fleet_Branch__c → Contact[update managers] → Contact[drivers] →
#   Fleet_Asset__c → Authorized_Driver__c → Telemetry_Violation__c →
#   Service_Ticket__c → Reservation__c
#
# Circular dependency: Fleet_Branch__c.Primary_Contact__c → Contact
#                      Contact.Driver_Branch__c → Fleet_Branch__c
# Resolution: two-pass
#   Pass A — create manager Contacts with Driver_Branch__c null
#   Pass B — create Fleet_Branches referencing those Contacts
#   Pass C — upsert manager Contacts by Email to set Driver_Branch__c
#   Pass D — create driver Contacts (branches now exist)

# ── 1. ACCOUNTS (7) ──────────────────────────────────────────────────────────
- object: Account
  count: 7
  fields:
    Name: ${{ fake.company() }} Fleet Services
    Type:
      random_choice:
        - Technology Partner: 2
        - Installation Partner: 2
        - Channel Partner / Reseller: 1
        - Customer: 1
        - Vendor: 1
    Industry:
      random_choice:
        - Transportation: 3
        - Insurance: 2
        - Technology: 1
        - Other: 1
    BillingCity:
      fake: city
    BillingState:
      fake: state_abbr
    BillingCountry: United States
    Phone: ${{ fake.numerify("(###) 555-####") }}
    Website: https://www.${{ fake.domain_name() }}

