        end_date: today
    fleetforce__Due_Date__c:
      date_between:
        start_date: -7d
        end_date: +30d
    fleetforce__Odometer__c:
      random_number:
        min: 5000
        max: 120000
    fleetforce__Tax_Rate__c: ${{ [7, 7.5, 8, 8.25] | random }}
    fleetforce__Total_Labor_Cost__c:
      random_number:
        min: 80
        max: 600
    fleetforce__Total_Parts_Cost__c:
      random_number:
        min: 20
        max: 500
    fleetforce__Fixed_Cost__c: 0
    fleetforce__Misc_Fees__c:
      random_number:
        min: 0
        max: 50
    fleetforce__Is_Labor_Taxable__c: ${{ fake.boolean(chance_of_getting_true=43) }}
    # Gated: Violation_Source only populated for Telemetry Alert tickets
    fleetforce__Violation_Source__c:
      if:
        - choice:
            when: ${{ this.fleetforce__Category__c == 'Telemetry Alert' }}
            pick:
              random_reference: fleetforce__Telemetry_Violation__c
        - choice:
            pick: null
    fleetforce__Approval_Status__c: ${{ (["Approved"] * 20 + ["Pending Approval"] * 10 + ["Rejected"] * 5) | random }}
    # Approved_By__c intentionally null — User lookup; no seeded User records

# ── 9. RESERVATIONS (30) ─────────────────────────────────────────────────────
- object: fleetforce__Reservation__c
  count: 30
  fields:
    fleetforce__Assigned_Asset__c:
      random_reference: fleetforce__Fleet_Asset__c
    fleetforce__Requestor_Contact__c:
      random_reference: Contact
    fleetforce__Origin_Branch__c:
      random_choice:
        - reference: branch_atl
        - reference: branch_den
        - reference: branch_dal
        - reference: branch_phx
    fleetforce__Destination_Branch__c:
      random_choice:
        - reference: branch_atl
        - reference: branch_den
        - reference: branch_dal
        - reference: branch_phx
    fleetforce__Status__c: ${{ (["Approved"] * 8 + ["Pending"] * 7 + ["Active"] * 6 + ["Completed"] * 6 + ["Rejected"] * 2 + ["Cancelled"] * 1) | random }}
    fleetforce__Priority__c: ${{ (["Low"] * 5 + ["Medium"] * 12 + ["High"] * 8 + ["Critical"] * 5) | random }}
    fleetforce__Start_Time__c:
      date_between:
        start_date: -30d
        end_date: +60d
    fleetforce__End_Time__c:
      date_between:
        start_date: +1d
        end_date: +90d
    fleetforce__Approval_Date__c:
      date_between:
        start_date: -14d
        end_date: today
    fleetforce__Cost_Center__c: ${{ fake.bothify("CC-???-###") }}
    fleetforce__Min_Seats__c: ${{ [2, 5, 5, 5, 7] | random }}
    fleetforce__Preferred_Body__c: ${{ (["Van"] * 10 + ["Pickup"] * 8 + ["SUV"] * 7 + ["Sedan"] * 5) | random }}
    fleetforce__Preferred_Engine__c: ${{ (["Gasoline"] * 14 + ["Diesel"] * 7 + ["Hybrid"] * 5 + ["Electric"] * 4) | random }}
    fleetforce__Guest_First_Name__c:
      fake: first_name
    fleetforce__Guest_Last_Name__c:
      fake: last_name
    fleetforce__Guest_Email__c:
      fake: email
    fleetforce__Guest_Phone__c: ${{ fake.numerify("(###) 555-####") }}
    # Requestor_User__c intentionally null — User lookup; no seeded User records
