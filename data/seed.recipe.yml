# ── 3c. DRIVER CONTACTS (20 drivers, branches now exist) ─────────────────────
# 20 individual Contact blocks with static nicknames drv01–drv20 so that
# driver-specific lookup fields in later objects can use an explicit 20-way
# random_choice over this exact set, excluding the 4 manager contacts.
- macro: driver_fields
  fields:
    FirstName:
      fake: first_name
    LastName:
      fake: last_name
    Email:
      fake: email
    Title: ${{ ["Route Delivery Specialist", "Express Delivery Driver", "Commercial Driver", "Fleet Driver", "Field Service Driver"] | random }}
    Department: ${{ ["Express Transport", "Route Delivery", "Field Services", "Logistics"] | random }}
    Phone: ${{ fake.numerify("(###) 555-####") }}
    MobilePhone: ${{ fake.numerify("(###) 555-####") }}
    fleetforce__Contact_Type__c: Driver
    fleetforce__Driver_Status__c: ${{ (["Active"] * 16 + ["Inactive"] * 2 + ["Suspended"] * 2) | random }}
    fleetforce__License_Class__c: ${{ (["Class D"] * 10 + ["Class B CDL"] * 5 + ["Class A CDL"] * 5) | random }}
    fleetforce__License_State__c: ${{ ["GA", "CO", "TX", "AZ"] | random }}
    fleetforce__License_Number__c: ${{ fake.bothify("??-#######") }}
    fleetforce__License_Expiry__c:
      date_between:
        start_date: +30d
        end_date: +730d
    fleetforce__Medical_Cert__c:
      date_between:
        start_date: -90d
        end_date: +365d
    fleetforce__Safety_Score__c:
      random_number:
        min: 65
        max: 99
    fleetforce__Driver_Branch__c:
      random_choice:
        - reference: branch_atl
        - reference: branch_den
        - reference: branch_dal
        - reference: branch_phx

