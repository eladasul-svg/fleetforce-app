# FleetForce Phase 1 Seed Recipe — 9-object motorpool spine
#
# Load order:
#   Account → Fleet_Schedule__c → Contact[managers, no Driver_Branch] →
#   Fleet_Branch__c → Contact[drivers, with Driver_Branch] →
#   Fleet_Asset__c → Authorized_Driver__c → Telemetry_Violation__c →
#   Service_Ticket__c → Reservation__c
#
# Circular dependency note:
#   Fleet_Branch.Primary_Contact → Contact (manager must exist first)
#   Contact.Driver_Branch → Fleet_Branch (branch must exist first for drivers)
# Resolution: manager contacts are created before branches, WITHOUT Driver_Branch.
#   Managers are associated with their branch via Fleet_Branch.Primary_Contact__c.
#   Only driver contacts carry Driver_Branch__c (set after branches exist).
#
# Snowfakery 3.6 quirks addressed:
#   - random_choice weighted syntax: use choice/pick/probability
#   - boolean fields: use fake.boolean()
#   - numeric random_choice: use ${{ [n1,n2,...] | random }}
#   - Violation_Source gated on Category == Telemetry Alert via if/choice/when block

# ── 1. ACCOUNTS (7) ──────────────────────────────────────────────────────────
- object: Account
  count: 7
  fields:
    Name: ${{ fake.company() }} Fleet Services
    Type:
      random_choice:
        - choice:
            pick: Technology Partner
            probability: 2
        - choice:
            pick: Installation Partner
            probability: 2
        - choice:
            pick: Channel Partner / Reseller
            probability: 1
        - choice:
            pick: Customer
            probability: 1
        - choice:
            pick: Vendor
            probability: 1
    Industry:
      random_choice:
        - choice:
            pick: Transportation
            probability: 3
        - choice:
            pick: Insurance
            probability: 2
        - choice:
            pick: Technology
            probability: 1
        - choice:
            pick: Other
            probability: 1
    BillingCity:
      fake: city
    BillingState:
      fake: state_abbr
    BillingCountry: United States
    Phone: ${{ fake.numerify("(###) 555-####") }}
    Website: https://www.${{ fake.domain_name() }}

