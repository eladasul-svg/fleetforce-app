# ── 3b. MANAGER CONTACTS — pass C (upsert to set Driver_Branch__c) ────────────
# update_key causes Snowfakery to upsert on Email rather than insert.
# Only the listed fields are written; all other Contact fields are untouched.
- object: Contact
  update_key: Email
  fields:
    Email: marcus.vance@fleetforce-demo.com
    fleetforce__Driver_Branch__c:
      reference: branch_atl

- object: Contact
  update_key: Email
  fields:
    Email: elena.reyes@fleetforce-demo.com
    fleetforce__Driver_Branch__c:
      reference: branch_den

- object: Contact
  update_key: Email
  fields:
    Email: david.holt@fleetforce-demo.com
    fleetforce__Driver_Branch__c:
      reference: branch_dal

- object: Contact
  update_key: Email
  fields:
    Email: sofia.nakamura@fleetforce-demo.com
    fleetforce__Driver_Branch__c:
      reference: branch_phx

